# Lokalni razvojni poslužitelji. Pokretanje: docker compose -f server/docker-compose.yml up -d
# Javni ključ hbbs-a nakon prvog pokretanja: server/data/id_ed25519.pub (upisuje se u klijent kao Key).
# LiveKit u --dev načinu: API ključ `devkey`, tajna `secret`, ws://localhost:7880. Samo za razvoj.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes: ["./data:/root"]
    ports: ["21115:21115", "21116:21116", "21116:21116/udp", "21118:21118"]
    depends_on: [hbbr]
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes: ["./data:/root"]
    ports: ["21117:21117", "21119:21119"]
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    restart: unless-stopped
